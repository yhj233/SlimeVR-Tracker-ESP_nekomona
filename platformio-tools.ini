[env]
lib_deps=
  https://github.com/SlimeVR/CmdParser.git
  https://github.com/SlimeVR/base64_arduino.git
monitor_speed = 115200
framework = arduino
build_flags =
  !python scripts/get_git_commit.py
  -O2
  -std=gnu++17
build_unflags =
  -Os
  -std=gnu++11

[env:BOARD_LOLIN_C3_MINI]
platform = espressif32 @ 6.1.0
build_flags = 
  ${env.build_flags}
  -DESP32C3
board = lolin_c3_mini
